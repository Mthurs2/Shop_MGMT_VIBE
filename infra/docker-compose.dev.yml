version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop_mgmt
      POSTGRES_USER: shop_app
      POSTGRES_PASSWORD: shop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/dockerfiles/api.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"

  web:
    build:
      context: ..
      dockerfile: infra/dockerfiles/web.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - api
    ports:
      - "3000:3000"

  worker:
    build:
      context: ..
      dockerfile: infra/dockerfiles/worker.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - redis

volumes:
  postgres_data:
  minio_data:
