version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop_mgmt
      POSTGRES_USER: shop_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/dockerfiles/api.Dockerfile
    env_file:
      - ../.env.prod
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/dockerfiles/web.Dockerfile
    env_file:
      - ../.env.prod
    depends_on:
      - api

  worker:
    build:
      context: ..
      dockerfile: infra/dockerfiles/worker.Dockerfile
    env_file:
      - ../.env.prod
    depends_on:
      - redis

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
